name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Capture the committed inputs before restoring or refreshing any files.
      # A new committed snapshot must never be overwritten by an older cache.
      - name: Scope publication cache to committed inputs
        id: publications
        run: echo "scope=${{ hashFiles('bibliography/*.json', '_data/publication_sync.json', 'scripts/sync_publications.py', 'requirements.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Restore publication snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            bibliography/scholar.json
            bibliography/metadata.json
            _data/publication_sync.json
          key: publications-v3-${{ steps.publications.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: publications-v3-${{ steps.publications.outputs.scope }}-

      - name: Install publication dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh publications and abstracts
        run: python scripts/sync_publications.py

      - name: Save publication snapshot
        uses: actions/cache/save@v4
        with:
          path: |
            bibliography/scholar.json
            bibliography/metadata.json
            _data/publication_sync.json
          key: publications-v3-${{ steps.publications.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build -d _site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
