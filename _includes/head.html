<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.name | escape }}{% elsif page.title %}{{ page.title | escape }} · {{ site.name | escape }}{% else %}{{ site.name | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta name="theme-color" content="#746381">

  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.name | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/team/group-1280.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/pb_favicon.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.name | escape }}" href="{{ '/feed.xml' | relative_url }}">

  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem('picky-theme'); } catch (error) { /* Storage may be blocked. */ }
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', saved === 'dark' || saved === 'light' ? saved : preferred);
    }());
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchOrganization",
    "name": {{ site.name | jsonify }},
    "url": {{ site.url | jsonify }},
    "description": {{ site.description | jsonify }},
    "founder": {
      "@type": "Person",
      "name": "Jay",
      "jobTitle": "Assistant Professor",
      "sameAs": [{{ site.links.personal | jsonify }}, {{ site.links.orcid | jsonify }}, {{ site.links.google_scholar | jsonify }}]
    },
    "parentOrganization": {
      "@type": "CollegeOrUniversity",
      "name": "University of Lausanne"
    }
  }
  </script>
</head>
