# Picky Binders group website

name: "Protein structure, interaction & design · UNIL"
title: "Context-aware deep learning for protein structure, interaction & design"
description: "Context-aware deep learning for protein structure, interaction & design."
url: "https://pickybinders.github.io"
baseurl: ""
repository: "PickyBinders/PickyBinders.github.io"
lang: "en"
encoding: "utf-8"
email: "janani.durairaj@unil.ch"

# Include Folded Weekly and all newer resources, independently of their titles.
resources_since: "2021-06-11"

# Light and dark colours live in _data/themes.yml.
theme_preset: "picky-parchment"

links:
  personal: "https://ninjani.github.io"
  department: "https://www.unil.ch/dbc/en/home.html"
  schwede: "https://www.biozentrum.unibas.ch/research/research-groups/research-groups-a-z/group/unit/research-group-torsten-schwede"
  google_scholar: "https://scholar.google.com/citations?user=PQ-my-kAAAAJ"
  github: "https://github.com/PickyBinders"
  orcid: "https://orcid.org/0000-0002-1698-4556"

nav_pages:
  - name: research
  - name: team
    url: /group/
  - name: publications
  - name: resources

collections:
  projects:
    output: true
    permalink: /projects/:path/
  teaching:
    output: true
    permalink: /teaching/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      sitemap: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: page

include:
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  parse_block_html: false

plugins:
  - jekyll-sitemap

exclude:
  - website-management
  - Gemfile
  - Gemfile.lock
  - node_modules
  - bibliography
  - scripts
  - requirements.txt
  - vendor
  - _site
